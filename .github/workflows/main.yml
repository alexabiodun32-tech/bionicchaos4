name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jar
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Package the mrpack
        run: python3 tools/make_mrpack.py

      - uses: actions/upload-artifact@v4
        with:
          name: bionicchaos-jar
          path: build/libs/bionicchaos-*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: bionicchaos-mrpack
          path: build/*.mrpack
