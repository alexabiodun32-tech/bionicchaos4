plugins {
    id 'java'
    id 'net.neoforged.moddev' version '1.0.19'
}

version = '1.0.0'
group = 'com.ire.bionicchaos'
base { archivesName = 'bionicchaos' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'

    runs {
        client { client() }
        server { server(); programArguments.add('--nogui') }
    }

    mods {
        bionicchaos { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
